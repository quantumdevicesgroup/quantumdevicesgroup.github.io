name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      # Fails with a clear message if Pages is not yet enabled for this repo.
      # One-time fix: Settings > Pages > Source > "GitHub Actions".
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # url and baseurl come from the Pages settings, so user sites
      # (you.github.io), project sites (you.github.io/repo), and custom
      # domains all work without editing _config.yml.
      - name: Build site
        run: |
          printf 'url: "%s"\nbaseurl: "%s"\n' "$PAGES_ORIGIN" "$PAGES_BASE_PATH" > _config_pages.yml
          bundle exec jekyll build --config _config.yml,_config_pages.yml
        env:
          JEKYLL_ENV: production
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
