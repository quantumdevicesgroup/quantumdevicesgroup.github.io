# ============================================================
# Identity
# ============================================================
name: "Quantum Devices Group"
title: "Quantum Devices Group"
institution: "UC Berkeley and Berkeley Lab"
email: alp@berkeley.edu
photo: people/alp-sipahigil.jpg
address: "572 Cory Hall, University of California, Berkeley, CA 94720"

links:
  google_scholar: "https://scholar.google.com/citations?user=0X-KuJAAAAAJ"
  github: "https://github.com/quantumdevicesgroup"
  researchgate: ""
  orcid: ""
  twitter: ""
  linkedin: ""
  cv: ""

# ============================================================
# Site settings
# ============================================================
accent_color: "#003262"      # Berkeley Blue
dark_mode: false             # the Berkeley brand theme has no dark mode
# Adobe Fonts web project with Freight Sans Pro and Freight Micro Pro
# (400/700, normal/italic). Its character set must be "All Characters" so
# letters such as ğ, ş, ı and İ use Freight instead of a fallback font.
adobe_fonts_kit: "scr0aog"
math: false
description: "The Sipahigil Lab at UC Berkeley and Berkeley Lab, led by Alp Sipahigil, builds scalable quantum hardware and studies the device physics that limits coherence."
# Other names people search for; used in page titles and structured data
alternate_names: ["Sipahigil Lab", "Sipahigil Lab @ Berkeley", "Sipahigil Group", "Berkeley Quantum Devices Group"]
# Shown in browser tabs and search results, as on the old WordPress site
title_suffix: "Sipahigil Lab @ Berkeley"
pi_faculty_page: "https://www2.eecs.berkeley.edu/Faculty/Homepages/alp.html"

url: ""
baseurl: ""

analytics:
  google_id: ""
  plausible_domain: ""
  umami_website_id: ""
  umami_src: ""
  goatcounter: ""

# ============================================================
# Navigation. `name` is a page in _pages/; `url` makes an external link.
# ============================================================
nav_pages:
  - name: research
    dropdown: research      # list the pages of this collection under it
  - name: team
    also_active: [/join/]   # highlight Team on the Join us pages too
    children:
      - {label: Join us, url: /join/}
  - name: publications
  - name: facilities
  - name: teaching
  - name: lab-dashboard
    label: Lab Dashboard
  - name: news
    label: News

# The live dashboard (repo quantumdevicesgroup/lab-status, published by the lab PC),
# embedded on /lab-dashboard/. After the domain move this resolves to
# quantumdevices.berkeley.edu/lab-status/, the same origin as this site.
lab_status_url: "https://quantumdevicesgroup.github.io/lab-status/"

# People are one file each in _people/ (see README.md).
collections:
  people:
    output: true
    permalink: /team/:name/
  research:
    output: true
    permalink: /research/:name/

defaults:
  - scope: {path: "", type: people}
    values: {layout: person}
  - scope: {path: "", type: posts}
    values: {layout: post}
  - scope: {path: "", type: research}
    values: {layout: research}

# ============================================================
# Publications (assets/ref.bib, built by scripts/build_bib.py)
# ============================================================
# Group members are bolded by _plugins/group_people.rb, so these stay empty.
scholar:
  last_name: ""
  first_name: []
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"
  # Template-only fields, kept out of the copyable BibTeX
  bibtex_skip_fields: [abstract, month_numeric, file, selected, code, slides, video, poster, data, equal, venuenote, link1label, link1url, link2label, link2url, link3label, link3url, language, urldate, abstractsource, thrusts, image, group, highlight, highlighted, homehighlight]

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
permalink: /news/:year/:month/:title/

include:
  - _pages

sass:
  style: compressed
  quiet_deps: true                # hide warnings from vendored Bootstrap SCSS
  silence_deprecations: [import]  # Bootstrap 5.3 still uses @import
  sourcemap: development          # no .map file in production builds

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

# Repository files that should not be published to the site
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - scripts
  - vendor
  - .bundle
  - node_modules
