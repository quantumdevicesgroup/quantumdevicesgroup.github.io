# 2020: Superconducting qubit to optical photon transduction
- doi: 10.1038/s41586-020-3038-6
  arxiv: '2004.04838'
  thrusts: [quantum-transduction]
  highlight: We convert the microwave-frequency excitation of a superconducting transmon qubit into an optical photon, using a nanomechanical resonator that couples to the qubit piezoelectrically and to light through radiation pressure. Detecting the emitted photons over an optical fiber, we record the qubit's quantum Rabi oscillations, a step toward optical networks that link remote superconducting quantum processors.
