# Group publications, newest first. scripts/build_bib.py turns this list into
# assets/ref.bib, taking metadata from Zotero (or Crossref/arXiv if a paper is
# not in Zotero). To add a paper: add its doi (and arxiv id, if any) at the
# top, then run  python3 scripts/build_bib.py
#
# Optional fields:
#   selected: true            no longer used (kept for reference); home-page slides come from highlight
#   equal: [Surname, ...]     equal-contribution authors (marked with *)
#   links: [{label, url}]     extra buttons, e.g. News & Views, talk video
#   venue_note: text          shown after the venue, e.g. News & Views
#   fix: {title: ...}         override a wrong field from Zotero/Crossref
#   thrusts: [slug, ...]      research directions (_research/*.md) this paper belongs to
#   highlight: text           two-sentence summary; puts the paper in the Research highlights
#                             sliders on the home page and on its research pages (thrusts)
#   home: false               keep a highlight off the home page (research pages only)
#   image: /images/...        figure for its highlight slide
#   group: true/false         override the automatic group-paper rule (2022 on, or PI last author)

