# 2026: Interface Piezoelectric Loss in Superconducting Qubits
- arxiv: '2605.15554'
  thrusts: [superconducting-qubits]
  equal: [Zhou, Yu]
  highlight: 'Superconducting qubits on silicon have a previously unrecognized loss channel: they radiate phonons through a weak piezoelectric response at the aluminum–silicon interface. We measure this loss in a transmon embedded in a surface acoustic wave resonator and predict that it overtakes two-level-system loss at high qubit frequencies.'
  image: /images/highlights/zhou-2026-interface-piezoelectric-loss.png

# 2026: Entanglement of a nuclear spin qubit register in silicon photonics
- doi: 10.1038/s41565-025-02066-0
  arxiv: '2504.15467'
  thrusts: [spin-qubits]
  selected: true
  links:
    - {label: "News & Views", url: "https://www.nature.com/articles/s41565-025-02094-w"}
  highlight: We realize a three-qubit register in silicon photonics from the electron spin of a T center and two nearby nuclear spins, with nuclear-spin coherence times up to 112 ms and entangling gates between the nuclear spins. Combined with the T center's telecom-band optical interface, these are key ingredients for a scalable quantum network node in silicon.
  image: /images/highlights/song-2026-nuclear-spin-register.jpg

# 2026: Observation of interface piezoelectricity in superconducting devices on silicon
- doi: 10.1038/s41467-025-67066-z
  arxiv: '2409.10626'
  thrusts: [superconducting-qubits]
  selected: true
  highlight: Bulk silicon is not piezoelectric, but the broken symmetry at aluminum–silicon interfaces produces a piezoelectric response that we detect from room temperature down to millikelvin temperatures. This effect, predicted decades ago and observed here for the first time in superconducting devices, is a significant surface loss channel for superconducting qubits.
  image: /images/highlights/zhou-2026-interface-piezoelectricity.png

# 2025: Laser-induced spectral diffusion of T centers in silicon nanophotonic devices
- doi: 10.1103/x2cv-2gcw
  arxiv: '2504.08898'
  thrusts: [spin-qubits]
  highlight: T centers in silicon nanophotonic devices have broadened optical lines, a challenge for generating indistinguishable photons. By tracking the optical frequency of single T centers in a photonic crystal cavity from nanoseconds to milliseconds, we find that the line is stable in the dark and identify laser-induced processes as the dominant source of spectral diffusion.
  image: /images/highlights/zhang-2025-laser-induced-spectral-diffusion.png
  home: false

# 2025: Multiplexed color centers in a silicon photonic cavity array
- doi: 10.1364/OPTICA.564691
  arxiv: '2501.17339'
  thrusts: [spin-qubits]
  highlight: We build arrays of photonic crystal cavities coupled to a common silicon bus waveguide, giving simultaneous access to individually addressable, cavity-enhanced T centers. We demonstrate frequency-multiplexed operation of two T centers in separate cavities, a route to efficient on-chip and long-distance entanglement distribution.
  image: /images/highlights/komza-2025-cavity-array.png
  home: false

