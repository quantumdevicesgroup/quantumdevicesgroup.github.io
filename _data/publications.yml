# 2025: Non-Markovian dynamics of a superconducting qubit in a phononic bandgap
- doi: 10.1038/s41567-024-02740-5
  arxiv: '2312.01031'
  thrusts: [superconducting-qubits]
  selected: true
  links:
    - {label: "News & Views", url: "https://www.nature.com/articles/s41567-024-02775-8"}
  highlight: Embedding a transmon qubit in a phononic-bandgap metamaterial suppresses phonon emission by the two-level-system defects it couples to, driving the qubit's dissipation into a non-Markovian regime. Co-designing the phonon environment opens a path to qubits that are both smaller and longer-lived.
  image: /images/highlights/odeh-2025-phononic-bandgap-qubit.jpg

# 2024: Acceptor-induced bulk dielectric loss in superconducting circuits on silicon
- doi: 10.1103/PhysRevX.14.041022
  arxiv: '2402.17155'
  thrusts: [superconducting-qubits]
  highlight: Boron acceptors in silicon behave like two-level systems, and even part-per-billion concentrations of boron in the substrate are enough to make superconducting qubits decay. By measuring resonators on silicon wafers with different boron concentrations, we give the first detailed microscopic picture of a two-level-system bath and show that substrate purity is critical for next-generation superconducting quantum processors.
  image: /images/highlights/zhang-2024-acceptor-key-image.png
  selected: true
  equal: [Zhang, Godeneli]

# 2024: Indistinguishable photons from an artificial atom in silicon photonics
- doi: 10.1038/s41467-024-51265-1
  arxiv: '2211.09305'
  thrusts: [spin-qubits]
  highlight: A G center, an artificial atom in a silicon waveguide, emits high-purity single photons in the telecom O-band. Using time-delayed two-photon interference, we show that these photons are indistinguishable, establishing artificial atoms in silicon photonics as quantum light sources for photonic quantum networks and processors.
  image: /images/highlights/komza-2024-indistinguishable-photons.png
  home: false
  selected: true
  equal: [Komza, Samutpraphoot]

